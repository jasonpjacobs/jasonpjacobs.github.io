<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jason Jacobs</title>
  <style>
    :root {
      --bg: #f6f7f9; --glow: rgba(47, 111, 222, .10);
      --card: #ffffff; --border: #e3e6eb; --group: #f9fafb;
      --text: #161a21; --muted: #5d6574; --line: #8a93a3;
      --tx: #2f6fde; --tx-fill: #eaf1fd;
      --rx: #0f9c84; --rx-fill: #e6f6f2;
      --ch: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e14; --glow: rgba(110, 168, 254, .12);
        --card: #121720; --border: #232a36; --group: #0f141c;
        --text: #e7ecf3; --muted: #8d96a6; --line: #6b7485;
        --tx: #7aa7ff; --tx-fill: #16223a;
        --rx: #3fd0b0; --rx-fill: #10261f;
        --ch: #fb923c;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 15% -10%, var(--glow), transparent 60%), var(--bg);
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 1040px; margin: 0 auto; padding: clamp(56px, 12vw, 128px) 16px 40px; }

    h1 {
      margin: 0 0 .35em;
      font-size: clamp(2.6rem, 7vw, 4.75rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-weight: 750;
      color: var(--text);
      background: linear-gradient(90deg, var(--text) 30%, var(--tx));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.4rem); color: var(--muted); }

    .figs { display: grid; gap: 24px; margin-top: clamp(48px, 8vw, 88px); }
    figure.card {
      min-width: 0; margin: 0; padding: 20px 20px 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -16px rgba(0, 0, 0, .18);
    }
    figcaption {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
      margin-top: 14px; font-size: .85rem; color: var(--muted);
    }
    figcaption strong { color: var(--text); font-weight: 600; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .8rem; }

    /* Block diagram: scrolls inside its card on narrow screens, never the page. */
    .scroll { overflow-x: auto; }
    .scroll svg { display: block; width: 100%; min-width: 680px; height: auto; }
    .bd { font-family: inherit; }
    .bd .g-tx, .bd .g-rx { fill: var(--group); stroke-width: 1; stroke-dasharray: 4 4; }
    .bd .g-tx { stroke: var(--tx); stroke-opacity: .45; }
    .bd .g-rx { stroke: var(--rx); stroke-opacity: .45; }
    .bd .grp { font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .bd .grp.tx { fill: var(--tx); } .bd .grp.rx { fill: var(--rx); }
    .bd .b-tx { fill: var(--tx-fill); stroke: var(--tx); stroke-width: 1.5; }
    .bd .b-rx { fill: var(--rx-fill); stroke: var(--rx); stroke-width: 1.5; }
    .bd .lbl { fill: var(--text); font-size: 14px; font-weight: 600; text-anchor: middle; }
    .bd .sub { fill: var(--muted); font-size: 11px; text-anchor: middle;
               font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bd .wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .bd .ah, .bd .dot { fill: var(--line); }
    .bd .chan { fill: none; stroke: var(--ch); stroke-width: 2.2; stroke-linecap: round; }
    .bd .ch { fill: var(--ch); font-size: 13px; font-weight: 600; text-anchor: middle; }

    /* Eye diagram: an instrument screen, dark in both themes. */
    .scope {
      max-width: 680px; margin: 0 auto; border-radius: 10px; overflow: hidden;
      background: #06080d; aspect-ratio: 640 / 400;
    }
    .scope canvas { display: block; width: 100%; height: 100%; }

    footer { max-width: 1040px; margin: 0 auto; padding: 8px 16px 48px; font-size: .85rem; color: var(--muted); }
    footer a { color: inherit; text-underline-offset: 3px; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Jason Jacobs</h1>
      <p class="tagline">Nothing to see here.  Not yet anyway.</p>
    </header>

    <div class="figs">
      <figure class="card">
        <div class="scroll">
          <svg class="bd" viewBox="0 0 1010 260" role="img" aria-labelledby="bd-title">
            <title id="bd-title">SerDes block diagram: a transmitter with serializer, FFE and driver; a lossy
              channel; a receiver with CTLE, DFE, slicer, clock and data recovery, and deserializer.</title>
            <defs>
              <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path class="ah" d="M0,0 L10,5 L0,10 z"/>
              </marker>
            </defs>

            <!-- Groups -->
            <rect class="g-tx" x="40" y="60" width="340" height="150" rx="14"/>
            <text class="grp tx" x="56" y="82">TX</text>
            <rect class="g-rx" x="500" y="30" width="420" height="215" rx="14"/>
            <text class="grp rx" x="516" y="52">RX</text>

            <!-- Transmitter -->
            <text class="sub" x="24" y="124">data</text>
            <path class="wire" d="M4,135 H58" marker-end="url(#ah)"/>
            <rect class="b-tx" x="60" y="110" width="90" height="50" rx="8"/>
            <text class="lbl" x="105" y="132">Serializer</text><text class="sub" x="105" y="149">N : 1</text>
            <path class="wire" d="M150,135 H163" marker-end="url(#ah)"/>
            <rect class="b-tx" x="165" y="110" width="90" height="50" rx="8"/>
            <text class="lbl" x="210" y="132">FFE</text><text class="sub" x="210" y="149">3-tap</text>
            <path class="wire" d="M255,135 H268" marker-end="url(#ah)"/>
            <rect class="b-tx" x="270" y="110" width="90" height="50" rx="8"/>
            <text class="lbl" x="315" y="132">Driver</text><text class="sub" x="315" y="149">SST</text>

            <!-- Channel -->
            <path class="wire" d="M360,135 H384"/>
            <path class="chan" d="M384,135 C394,112 404,158 414,135 S434,112 444,135 S464,158 474,135 S486,124 492,135"/>
            <path class="wire" d="M492,135 H518" marker-end="url(#ah)"/>
            <text class="ch" x="440" y="104">channel</text>
            <text class="sub" x="440" y="176">loss · ISI</text>

            <!-- Receiver -->
            <rect class="b-rx" x="520" y="110" width="80" height="50" rx="8"/>
            <text class="lbl" x="560" y="132">CTLE</text><text class="sub" x="560" y="149">peaking</text>
            <path class="wire" d="M600,135 H622" marker-end="url(#ah)"/>
            <circle class="b-rx" cx="640" cy="135" r="16"/>
            <text class="lbl" x="640" y="140">Σ</text>
            <path class="wire" d="M656,135 H678" marker-end="url(#ah)"/>
            <rect class="b-rx" x="680" y="110" width="80" height="50" rx="8"/>
            <text class="lbl" x="720" y="132">Slicer</text><text class="sub" x="720" y="149">sampler</text>
            <path class="wire" d="M760,135 H798" marker-end="url(#ah)"/>
            <circle class="dot" cx="775" cy="135" r="3"/>
            <rect class="b-rx" x="800" y="110" width="100" height="50" rx="8"/>
            <text class="lbl" x="850" y="132">Deserializer</text><text class="sub" x="850" y="149">1 : N</text>
            <path class="wire" d="M900,135 H1002" marker-end="url(#ah)"/>
            <text class="sub" x="960" y="124">data</text>

            <!-- DFE feedback -->
            <path class="wire" d="M775,135 V205 H752" marker-end="url(#ah)"/>
            <rect class="b-rx" x="660" y="185" width="90" height="40" rx="8"/>
            <text class="lbl" x="705" y="203">DFE</text><text class="sub" x="705" y="218">taps</text>
            <path class="wire" d="M660,205 H640 V153" marker-end="url(#ah)"/>

            <!-- Clock and data recovery -->
            <path class="wire" d="M850,110 V87" marker-end="url(#ah)"/>
            <rect class="b-rx" x="800" y="45" width="100" height="40" rx="8"/>
            <text class="lbl" x="850" y="63">CDR</text><text class="sub" x="850" y="78">bang-bang</text>
            <path class="wire" d="M800,65 H720 V108" marker-end="url(#ah)"/>
            <text class="sub" x="760" y="58">clk</text>
          </svg>
        </div>
        <figcaption><strong>SerDes link</strong><span class="mono">TX → channel → RX</span></figcaption>
      </figure>

      <figure class="card">
        <div class="scope">
          <canvas id="eye" width="640" height="400" role="img"
                  aria-label="Eye diagram of a PRBS7 NRZ signal after a lossy channel"></canvas>
        </div>
        <figcaption>
          <strong>Eye diagram</strong>
          <span class="mono">PRBS7 · NRZ · 2-pole channel · 0.025&nbsp;UI&nbsp;RJ</span>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer><a href="https://github.com/jasonpjacobs">github.com/jasonpjacobs</a></footer>

  <script>
    // Eye diagram: a jittered PRBS7 NRZ stream through a two-pole channel with a little
    // noise, folded into a 2-UI density histogram and drawn with an inferno-like color map.
    (function () {
      const canvas = document.getElementById('eye');
      const ctx = canvas.getContext('2d');
      const S = 320, W = 2 * S, H = 400;          // samples per UI; histogram size
      const NB = 3000, VMAX = 1.5, SKIP = 20;     // bits; vertical range; settling bits
      const TAU = 0.3, RJ = 0.025;                // channel pole (UI); random jitter (UI rms)

      let seed = 12345;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      const gauss = () => {
        let u = 0; while (u === 0) u = rnd();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
      };

      function simulate() {
        let lfsr = 0x7f;
        const bits = new Int8Array(NB);
        for (let k = 0; k < NB; k++) {
          const b = ((lfsr >> 6) ^ (lfsr >> 5)) & 1;
          lfsr = ((lfsr << 1) | b) & 0x7f;
          bits[k] = b ? 1 : -1;
        }
        const N = NB * S, y = new Float32Array(N);
        const a = 1 - Math.exp(-1 / (TAU * S));
        let y1 = -1, y2 = -1, n = 0, k = 0;
        let next = S + Math.round(gauss() * RJ * S);
        for (let i = 0; i < N; i++) {
          if (i >= next && k < NB - 1) { k++; next = (k + 1) * S + Math.round(gauss() * RJ * S); }
          y1 += a * (bits[k] - y1);
          y2 += a * (y1 - y2);
          n = 0.92 * n + 0.012 * gauss();
          y[i] = y2 + n;
        }
        // Circular mean of the crossing phase, so the eye sits centered in the window.
        let c = 0, s = 0;
        for (let i = SKIP * S; i < N; i++) {
          if ((y[i - 1] < 0) !== (y[i] < 0)) {
            const th = 2 * Math.PI * (i % S) / S; c += Math.cos(th); s += Math.sin(th);
          }
        }
        const phase = (Math.atan2(s, c) / (2 * Math.PI) + 1) % 1;
        const offset = Math.round((phase - 0.5) * S + S) % S;
        return { y, N, offset };
      }

      const stops = [[0, [40, 11, 84]], [.25, [101, 21, 110]], [.5, [188, 55, 84]],
                     [.75, [249, 142, 9]], [1, [252, 255, 164]]];
      const lut = new Uint8Array(256 * 3);
      for (let t = 0; t < 256; t++) {
        const x = t / 255;
        let j = 0; while (j < stops.length - 2 && x > stops[j + 1][0]) j++;
        const [x0, c0] = stops[j], [x1, c1] = stops[j + 1], f = (x - x0) / (x1 - x0);
        for (let ch = 0; ch < 3; ch++) lut[t * 3 + ch] = Math.round(c0[ch] + f * (c1[ch] - c0[ch]));
      }

      const hist = new Float32Array(W * H);
      const img = ctx.createImageData(W, H);
      const row = v => Math.max(0, Math.min(H - 1, Math.round((VMAX - v) / (2 * VMAX) * (H - 1))));
      const add = (col, r0, r1) => {
        if (r0 > r1) { const t = r0; r0 = r1; r1 = t; }
        for (let r = r0; r <= r1; r++) hist[r * W + col]++;
      };

      function draw() {
        let max = 0;
        for (let j = 0; j < hist.length; j++) if (hist[j] > max) max = hist[j];
        const L = Math.log1p(max) || 1, d = img.data;
        for (let j = 0; j < hist.length; j++) {
          const o = j * 4, h = hist[j];
          if (h === 0) { d[o] = 6; d[o + 1] = 8; d[o + 2] = 13; }
          else {
            const t = Math.min(255, Math.round(30 + 225 * Math.log1p(h) / L)) * 3;
            d[o] = lut[t]; d[o + 1] = lut[t + 1]; d[o + 2] = lut[t + 2];
          }
          d[o + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        // Graticule: 8 x 6 divisions, brighter center lines.
        for (let i = 1; i < 8; i++) line(i * W / 8, 0, i * W / 8, H, i === 4 ? .16 : .07);
        for (let i = 1; i < 6; i++) line(0, i * H / 6, W, i * H / 6, i === 3 ? .16 : .07);
      }
      function line(x0, y0, x1, y1, alpha) {
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.round(x0) + .5, Math.round(y0) + .5);
        ctx.lineTo(Math.round(x1) + .5, Math.round(y1) + .5); ctx.stroke();
      }

      function start() {
        const { y, N, offset } = simulate();
        let i = SKIP * S;
        const bin = upto => {
          for (; i < upto; i++) {
            const p = ((i - offset) % S + S) % S, r0 = row(y[i - 1]), r1 = row(y[i]);
            add(p, r0, r1); add(p + S, r0, r1);
          }
        };
        const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (still) { bin(N); draw(); return; }
        const step = Math.ceil((N - i) / 60);    // about one second of accumulation
        (function frame() {
          bin(Math.min(N, i + step)); draw();
          if (i < N) requestAnimationFrame(frame);
        })();
      }

      draw();
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(es => {
          if (es.some(e => e.isIntersecting)) { io.disconnect(); start(); }
        }, { threshold: 0.3 });
        io.observe(canvas);
      } else start();
    })();
  </script>
  <script data-goatcounter="https://jasonpjacobs.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
